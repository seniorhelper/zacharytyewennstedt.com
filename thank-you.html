<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message Received — Zachary Tye Wennstedt</title>
  <meta name="robots" content="noindex" />

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #030510;

    .wrap { max-width: 560px; }

    a {
      display: inline-block;
      background: #FFE500;
      color: #030510;
      text-decoration: none;
      padding: 14px 32px;

      font-weight: 800;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: all 0.3s;
    }
    a:hover { box-shadow: 0 0 30px rgba(255,229,0,0.5); transform: translateY(-2px); }

  <div class="wrap">
    <div class="icon">⚡</div>
